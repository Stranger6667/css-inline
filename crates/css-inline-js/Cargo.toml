[package]
name = "css-inline-js"
version = "0.22.1"
authors.workspace = true
edition = "2024"
readme = "README.md"
description = "High-performance library for inlining CSS into HTML 'style' attributes"
repository.workspace = true
keywords = ["css", "html", "email", "stylesheet", "inlining"]
categories = ["web-programming"]
license.workspace = true
rust-version = "1.88"
include = ["src/*.rs", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
crate-type = ["cdylib"]

[target.'cfg(not(any(target_os = "linux", target_family = "wasm")))'.dependencies]
mimalloc = "0.1"

[target.'cfg(all(target_os = "linux", not(target_arch = "arm")))'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "3", features = ["napi4", "async"] }
napi-derive = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4.0", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.css-inline]
path = "../css-inline"
version = "*"
default-features = false
features = ["http", "file", "stylesheet-cache", "async"]

[target.'cfg(target_arch = "wasm32")'.dependencies.css-inline]
path = "../css-inline"
version = "*"
default-features = false
features = ["http", "async"]

[build-dependencies]
napi-build = "2"
