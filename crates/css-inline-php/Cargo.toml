[package]
name = "css-inline-php"
version = "0.23.0"
authors.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "css_inline_php"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "0.16.3"
rayon = "1"

[dependencies.css-inline]
path = "../css-inline"
version = "*"
default-features = false
features = ["http", "file", "stylesheet-cache"]
