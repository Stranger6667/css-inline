[package]
name = "css-inline-c"
version = "0.23.0"
authors.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "css_inline"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"

[dependencies.css-inline]
path = "../css-inline"
version = "*"
default-features = false
features = ["http", "file", "stylesheet-cache"]
