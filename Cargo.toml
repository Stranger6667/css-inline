[workspace]
members = ["crates/*", "profiler"]
# Built by their own toolchains (maturin, napi, gradle, cargo-fuzz) with their own profiles and `target/`
exclude = ["bindings", "fuzz"]
resolver = "3"

[workspace.package]
authors = ["Dmitry Dygalo <dmitry@dygalo.dev>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Stranger6667/css-inline"
rust-version = "1.85"

[profile.release]
lto = "fat"
codegen-units = 1

# `cargo build -p profiler --profile profiling`
[profile.profiling]
inherits = "release"
debug = true
